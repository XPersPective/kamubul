name: Android screenshots

# Google Play görselleri: gerçek uygulama Android emülatöründe çekilir
# (integration_test/store_capture_test.dart, tool/brand/store_frames.py).
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: napp_kit erişimi
        env:
          NAPP_KIT_DEPLOY_KEY: ${{ secrets.NAPP_KIT_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$NAPP_KIT_DEPLOY_KEY" > ~/.ssh/napp_kit
          chmod 600 ~/.ssh/napp_kit
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/napp_kit -o IdentitiesOnly=yes"
          git config --global url."git@github.com:XPersPective/napp_kit".insteadOf "https://github.com/XPersPective/napp_kit"
      - run: flutter pub get
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Çekim
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell cmd uimode night no || true
            flutter drive --driver=test_driver/store_capture.dart --target=integration_test/store_capture_test.dart --dart-define=KAMUBUL_API=https://kamubul-api.devx8585.workers.dev --dart-define=CONTACT_EMAIL=devcrazypenguin@gmail.com --dart-define=PRIVACY_URL=https://kamubul-api.devx8585.workers.dev/privacy/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-capture
          path: build/store_capture/*.png
