name: iOS release

# İmzalı IPA üretir ve App Store Connect'e (TestFlight işlemesi) yükler.
# İnceleme gönderimi ve yayın ayrıca yapılır. Sırlar: ASC_*, IOS_*, NAPP_KIT_DEPLOY_KEY.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'App Store Connect''e yükle'
        type: boolean
        default: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: 53X3279WA3
      BUNDLE_ID: com.crazypenguin.kamubul
      PROFILE_NAME: KamuBul AppStore
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: napp_kit erişimi
        env:
          NAPP_KIT_DEPLOY_KEY: ${{ secrets.NAPP_KIT_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$NAPP_KIT_DEPLOY_KEY" > ~/.ssh/napp_kit
          chmod 600 ~/.ssh/napp_kit
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/napp_kit -o IdentitiesOnly=yes"
          git config --global url."git@github.com:XPersPective/napp_kit".insteadOf "https://github.com/XPersPective/napp_kit"
      - name: İmzalama
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          kc="$RUNNER_TEMP/build.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision")")
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
      - name: Runner hedefini elle imzalamaya al
        run: |
          python3 - <<'PY'
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          key = 'PRODUCT_BUNDLE_IDENTIFIER = com.crazypenguin.kamubul;'
          add = ('\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = 53X3279WA3;'
                 '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "KamuBul AppStore";'
                 '\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";')
          assert s.count(key) == 3, s.count(key)
          open(p, 'w', encoding='utf-8').write(s.replace(key, key + add))
          PY
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
      - run: flutter pub get
      - name: IPA
        run: flutter build ipa --release --build-number=$((100 + GITHUB_RUN_NUMBER)) --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: KamuBul-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
      - name: App Store Connect'e yükle
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
