name: CI

# Uygulama hattı. Çekirdek paket ve arka uç ayrı çalışır: backend.yml.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: XPersPective/napp_kit
          path: kit
          ssh-key: ${{ secrets.NAPP_KIT_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Kilitli napp_kit commitlerini yerel salt okunur kopyadan çöz
        run: |
          $kitUri = ([System.Uri](Resolve-Path ../kit).Path).AbsoluteUri
          git config --global "url.$kitUri.insteadOf" https://github.com/XPersPective/napp_kit.git
      - run: python -m unittest discover -s tool/ios -p 'test_*.py'
      - run: flutter pub get
      - run: flutter pub get
        working-directory: app/packages/kamubul_core
      - run: dart pub get
        working-directory: app/backend
      - run: flutter analyze
      - run: flutter test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
