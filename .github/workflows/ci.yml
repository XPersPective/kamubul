name: CI

# Uygulama hattı. Çekirdek paket ve arka uç ayrı çalışır: backend.yml.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # napp_core / napp_pro / napp_ads özel bir depodan (XPersPective/napp_kit)
      # gelir. Depo gizli ise NAPP_KIT_TOKEN adlı bir gizli değer (yalnızca o
      # depoyu okuyabilen jeton) tanımlayın; yoksa adım atlanır.
      - name: napp_kit erişimi
        env:
          NAPP_KIT_TOKEN: ${{ secrets.NAPP_KIT_TOKEN }}
        run: |
          if [ -n "$NAPP_KIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${NAPP_KIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
