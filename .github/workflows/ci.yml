name: CI

# Uygulama hattı. Çekirdek paket ve arka uç ayrı çalışır: backend.yml.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # napp_kit özel depodur: yalnızca o depoya okuma yetkili deploy key kullanılır.
      - name: napp_kit erişimi
        env:
          NAPP_KIT_DEPLOY_KEY: ${{ secrets.NAPP_KIT_DEPLOY_KEY }}
        run: |
          if [ -n "$NAPP_KIT_DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s
' "$NAPP_KIT_DEPLOY_KEY" > ~/.ssh/napp_kit
            chmod 600 ~/.ssh/napp_kit
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global core.sshCommand "ssh -i ~/.ssh/napp_kit -o IdentitiesOnly=yes"
            git config --global url."git@github.com:XPersPective/napp_kit".insteadOf "https://github.com/XPersPective/napp_kit"
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
