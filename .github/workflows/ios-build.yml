name: iOS build

# İmzasız iOS derlemesi: iOS'un derlendiğini ve açılış yapılandırmasının
# geçerli olduğunu doğrular. Mağazaya gönderim yapmaz; imzalama ve yükleme için
# Apple Developer hesabı, App Store Connect API anahtarı ve imzalama sırları
# gerekir (bkz. docs/IOS_RELEASE.md). Genel depolarda macOS çalıştırıcıları ücretsizdir.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-build.yml'

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # napp_kit özel depodur: yalnızca o depoya okuma yetkili deploy key kullanılır.
      - name: napp_kit erişimi
        env:
          NAPP_KIT_DEPLOY_KEY: ${{ secrets.NAPP_KIT_DEPLOY_KEY }}
        run: |
          if [ -n "$NAPP_KIT_DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$NAPP_KIT_DEPLOY_KEY" > ~/.ssh/napp_kit
            chmod 600 ~/.ssh/napp_kit
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global core.sshCommand "ssh -i ~/.ssh/napp_kit -o IdentitiesOnly=yes"
            git config --global url."git@github.com:XPersPective/napp_kit".insteadOf "https://github.com/XPersPective/napp_kit"
          fi
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Sürüm ve paket kimliği
        run: |
          plist=build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist"
      - uses: actions/upload-artifact@v4
        with:
          name: Runner.app-unsigned
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
