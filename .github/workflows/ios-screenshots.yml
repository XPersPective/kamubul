name: iOS screenshots

# App Store görüntüleri: gerçek uygulama iPhone Pro Max simülatöründe çekilir.
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: napp_kit erişimi
        env:
          NAPP_KIT_DEPLOY_KEY: ${{ secrets.NAPP_KIT_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$NAPP_KIT_DEPLOY_KEY" > ~/.ssh/napp_kit
          chmod 600 ~/.ssh/napp_kit
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/napp_kit -o IdentitiesOnly=yes"
          git config --global url."git@github.com:XPersPective/napp_kit".insteadOf "https://github.com/XPersPective/napp_kit"
      - run: flutter pub get
      - name: Simülatör
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if 'Pro Max' in x['name']];c.sort(key=lambda x:x['name']);print(c[-1]['udid']);print(c[-1]['name'],file=sys.stderr)")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl spawn "$udid" defaults write -g AppleLanguages -array tr
          xcrun simctl spawn "$udid" defaults write -g AppleLocale tr_TR
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Çekim
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p build/store_capture
          flutter test integration_test/store_capture_test.dart -d "$UDID" --dart-define=KAMUBUL_API=https://kamubul-api.devx8585.workers.dev --dart-define=CONTACT_EMAIL=devcrazypenguin@gmail.com --dart-define=PRIVACY_URL=https://xperspective.github.io/kamubul/gizlilik/ 2>&1 | while IFS= read -r line; do
            echo "$line"
            case "$line" in
              *STORE_CAPTURE\ *) n="${line##*STORE_CAPTURE }"; sleep 2; xcrun simctl io "$UDID" screenshot "build/store_capture/$n.png" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-capture
          path: build/store_capture/*.png
