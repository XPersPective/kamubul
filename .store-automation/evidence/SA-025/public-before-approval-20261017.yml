              - heading "Bu uygulama hakkında" [level=2] [ref=f6e136]
              - button "Daha fazla bilgi için Bu uygulama hakkında bölümüne bakın" [ref=f6e138] [cursor=pointer]:
                - generic [aria-hidden] [ref=f6e139]: arrow_forward
            - generic [ref=f6e140]:
              - generic [ref=f6e141]: "Uzun bir kamu ilanındaki şartların size uyup uymadığını anlamaya çalışırken her satırı tek tek çözmek zorunda değilsiniz. KamuBul Asistan’a ilanı sorun; yaş, eğitim ve KPSS koşullarını ilanın tam metniyle karşılaştırıp size madde madde açıklasın. Sonucu Uygun, Uygun değil veya Bilinmiyor olarak gösterir. Başvuru yapmadan önce resmî ilan metnini mutlaka kontrol edin.KAMUBUL ASİSTAN İLANI SİZİN İÇİN İNCELER• İlanın tam metnini açın ve Asistan’a sorunuzu yazın.• Yaş, öğrenim durumu ve KPSS puan türü/puanı gibi bilgilerinizi şartlarla karşılaştırın.• Hangi koşulun uyduğunu, uymadığını veya metinden doğrulanamadığını ayrı ayrı görün.• Örneğin: “Ankara’da lisans mezunuyum, 28 yaşındayım ve KPSS P3 puanım 75. Bu ilanın şartları bana uyuyor mu?”• Asistan yardımcı olur; başvuru şartları için bağlayıcı olan ilanın resmî metnidir. Yapay zekâ yanıtları hata içerebilir.KAMU PERSONELİ VE İŞÇİ İLANLARI TEK YERDEKamuBul; kadrolu veya sözleşmeli memur, sürekli veya geçici işçi, belediye ve diğer kamu kurumu personel ilanlarını bir araya getirir. Üniversitelerin akademik kadroları ile bakanlıkların uzman ve uzman yardımcısı alımları da ilan kapsamındadır. KPSS puanı isteyen ve istemeyen ilanları takip edin.İLANLARI KRİTERLERİNİZE GÖRE BULUN• Şehir, kurum, meslek, yaş, eğitim düzeyi, KPSS puan türü ve puanına göre filtreleyin.• Size kesin uyan ilanları öne alın; şartları doğrulanamayanları ayrı görün.• İşçi, personel, belediye ve son 30 gün gibi hazır süzgeçleri kullanın.• Aramalarınız ve seçimleriniz hatırlansın; ilgilendiğiniz ilanları kaydedin.SON BAŞVURU TARİHİNİ TAKİP EDİNİlanlardaki kontenjanı, pozisyon sayısını, eğitim ve KPSS koşullarını, yaşı ve son başvuru tarihini özet halinde görün. Başvuru süresi yaklaşırken kalan gün rozetlerini kullanın. “Yayımdan itibaren 15 gün” gibi sürelerde tarih tahmini olduğunu göz önünde bulundurun.UZUN İLAN METİNLERİNİ DAHA KOLAY OKUYUNHer pozisyonu ayrı kartta inceleyin. Resmî metinlerdeki başlıklar ve tablolar okunaklı biçimde düzenlenir; yapay zekâ katkısıyla çıkarılan bilgiler uygulamada belirtilir. Yazı boyutunu ayarlayın, açık veya koyu temayı seçin. Kaydettiğiniz ilanları çevrimdışı açın.ÜCRETSİZ KULLANIM VE KAMUBUL PROHesap açmadan ilanları inceleyin. Temel ilanlar ve filtreler ücretsizdir. İlk 7 gün reklam gösterilmez; sonraki kullanımda banner ve seyrek tam ekran reklamlar olabilir. Ücretsiz sürümde KamuBul Asistan’ı günde 10 soruya kadar kullanabilirsiniz.KamuBul Pro aylık üyelikle reklamları kaldırır ve Asistan kullanım sınırını günde 50 soruya çıkarır. Abonelik aylık yenilenir; Google Play > Abonelikler bölümünden istediğiniz zaman iptal edebilirsiniz. Satın almadan önce Google Play’de gösterilen güncel fiyatı ve yenileme koşullarını inceleyin.AÇIK KAYNAK VE GİZLİLİKKamuBul, GPL-3.0 lisanslı açık kaynaklı bir uygulamadır. Uygulama ve sunucu kodunu inceleyebilir, katkıda bulunabilirsiniz: https://github.com/XPersPective/kamubulHesap gerekmez. Kaydedilen aramalar ve ilanlar cihazınızda tutulur. Hizmet için gereken bilgiler sunucuya şifreli bağlantıyla iletilir; kişisel veriler satılmaz. Ayrıntılar: https://kamubul-api.devx8585.workers.dev/privacy/RESMÎ OLMAYAN BAĞIMSIZ UYGULAMAKamuBul herhangi bir bakanlık, kamu kurumu, ÖSYM veya resmî ilan sitesiyle bağlantılı değildir, onlar tarafından onaylanmamıştır ve resmî uygulamaları değildir. İlanlar kamuya açık kaynaklardan derlenir. Kaynaklar: kariyerkapisi.gov.tr, ilan.gov.tr, esube.iskur.gov.tr ve kamuilan.sbb.gov.tr. Başvurmadan önce güncel ve bağlayıcı ilan metnini ilgili kurumun resmî sayfasından kontrol edin."
